<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender Neon - Fast Level Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030408;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 10px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .info-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-title {
            font-size: 0.65rem;
            color: #7b809a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(0, 240, 255, 0.4);
        }

        canvas {
            display: block;
            background-color: #020205;
            cursor: crosshair;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 5, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            transition: opacity 0.3s ease;
            padding: 20px;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.9);
        }

        .author-tag {
            font-size: 1rem;
            font-weight: bold;
            color: #ff007f;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #9398ac;
            margin-bottom: 8px;
        }

        .badge-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .boss-badge {
            font-size: 0.72rem;
            font-weight: bold;
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.12);
            border: 1px solid #ffaa00;
            padding: 4px 12px;
            border-radius: 20px;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.25);
            letter-spacing: 0.5px;
            animation: pulseBoss 1.5s infinite alternate ease-in-out;
        }

        .buff-badge {
            font-size: 0.72rem;
            font-weight: bold;
            color: #00ff66;
            background: rgba(0, 255, 102, 0.12);
            border: 1px solid #00ff66;
            padding: 4px 12px;
            border-radius: 20px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.25);
            letter-spacing: 0.5px;
            animation: pulseBuff 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulseBoss {
            0% { transform: scale(0.96); box-shadow: 0 0 8px rgba(255, 170, 0, 0.2); }
            100% { transform: scale(1.04); box-shadow: 0 0 18px rgba(255, 170, 0, 0.6); }
        }

        @keyframes pulseBuff {
            0% { transform: scale(0.96); box-shadow: 0 0 8px rgba(0, 255, 102, 0.2); }
            100% { transform: scale(1.04); box-shadow: 0 0 18px rgba(0, 255, 102, 0.6); }
        }

        .ship-selection-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #00ff66;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .ship-list {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
        }

        .ship-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 8px;
            width: 130px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ship-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
        }

        .ship-card.selected {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            background: rgba(0, 240, 255, 0.1);
        }

        .ship-name {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .ship-preview-canvas {
            width: 48px;
            height: 48px;
            margin-bottom: 6px;
        }

        .stat-group {
            width: 100%;
            font-size: 0.65rem;
            color: #aaa;
            text-align: left;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .btn {
            padding: 12px 34px;
            font-size: 1rem;
            font-weight: bold;
            color: #020205;
            background: #00f0ff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 240, 255, 1);
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="info-box">
                <span class="info-title">Skor</span>
                <span id="score" class="info-value">0</span>
            </div>
            <div class="info-box">
                <span class="info-title">Level</span>
                <span id="level" class="info-value" style="color: #00ff66; text-shadow: 0 0 10px rgba(0,255,102,0.6);">1</span>
            </div>
            <div class="info-box">
                <span class="info-title">Nyawa</span>
                <span id="lives" class="info-value" style="color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.6);">3</span>
            </div>
            <div class="info-box">
                <span class="info-title">Dmg Multiplier</span>
                <span id="dmg-mult" class="info-value" style="color: #ff00ff; text-shadow: 0 0 10px rgba(255,0,255,0.6);">1x</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="450" height="550"></canvas>

            <div id="startOverlay" class="overlay">
                <h1 class="title">SPACE DEFENDER</h1>
                <div class="author-tag">By Arya</div>
                <p class="subtitle">Fast Level Progression Active!</p>
                
                <div class="badge-container">
                    <div class="boss-badge">⚡ WARNING: EPIC BOSS MUNCUL TIAP 10 LEVEL! ⚡</div>
                    <div class="buff-badge">🎁 KALAHKAN MUSUH & AMBIL DROP BUFF POWER-UP! 🎁</div>
                </div>

                <div class="ship-selection-title">--- Pilih Pesawat Super ---</div>
                <div class="ship-list" id="shipList"></div>

                <button id="startBtn" class="btn">Mulai Main</button>
            </div>

            <div id="gameOverOverlay" class="overlay hidden">
                <h1 class="title" style="color: #ff0055; text-shadow: 0 0 20px rgba(255,0,85,0.9);">GAME OVER</h1>
                <div class="author-tag">By Arya</div>
                <p id="finalScoreText" class="subtitle">Skor Kamu: 0 | Level: 1</p>
                <button id="restartBtn" class="btn">Coba Lagi</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const livesElement = document.getElementById('lives');
        const dmgMultElement = document.getElementById('dmg-mult');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const shipListContainer = document.getElementById('shipList');

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const ships = [
            {
                name: 'Hyperion Starlight',
                color: '#00f0ff',
                accentColor: '#ffffff',
                wingColor: '#0088ff',
                speed: 4.5,
                damage: 8,
                fireRate: 22,
                lives: 3,
                type: 'hyperion'
            },
            {
                name: 'Viper Cyberwing',
                color: '#ffaa00',
                accentColor: '#ff0055',
                wingColor: '#ffea00',
                speed: 6.5,
                damage: 14,
                fireRate: 18,
                lives: 4,
                type: 'viper'
            },
            {
                name: 'Aegis Sentinel',
                color: '#e600ff',
                accentColor: '#00ffaa',
                wingColor: '#7700ff',
                speed: 8.5,
                damage: 20,
                fireRate: 14,
                lives: 5,
                type: 'aegis'
            }
        ];

        let selectedShipIndex = 0;
        let playerBuffs = { damageMultiplier: 1, fireRateBoost: 0 };
        let activeBoss = null;
        let bossLevelActive = false;
        let targetX = canvas.width / 2;

        function renderDetailedShip(targetCtx, x, y, width, height, shipData) {
            targetCtx.save();
            targetCtx.translate(x, y);
            const scale = width / 50;
            targetCtx.scale(scale, scale);

            targetCtx.shadowBlur = 18;
            targetCtx.shadowColor = shipData.color;

            if (shipData.type === 'hyperion') {
                targetCtx.fillStyle = '#00ffff';
                targetCtx.beginPath();
                targetCtx.moveTo(-6, 20);
                targetCtx.lineTo(0, 32 + Math.random() * 8);
                targetCtx.lineTo(6, 20);
                targetCtx.fill();

                targetCtx.fillStyle = shipData.color;
                targetCtx.beginPath();
                targetCtx.moveTo(0, -28);
                targetCtx.lineTo(9, -10);
                targetCtx.lineTo(26, 8);
                targetCtx.lineTo(22, 22);
                targetCtx.lineTo(10, 15);
                targetCtx.lineTo(5, 22);
                targetCtx.lineTo(-5, 22);
                targetCtx.lineTo(-10, 15);
                targetCtx.lineTo(-22, 22);
                targetCtx.lineTo(-26, 8);
                targetCtx.lineTo(-9, -10);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = shipData.wingColor;
                targetCtx.beginPath();
                targetCtx.moveTo(9, -8);
                targetCtx.lineTo(24, 7);
                targetCtx.lineTo(18, 14);
                targetCtx.lineTo(8, 2);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.beginPath();
                targetCtx.moveTo(-9, -8);
                targetCtx.lineTo(-24, 7);
                targetCtx.lineTo(-18, 14);
                targetCtx.lineTo(-8, 2);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(-25, -2, 3, 16);
                targetCtx.fillRect(22, -2, 3, 16);

                targetCtx.fillStyle = shipData.accentColor;
                targetCtx.beginPath();
                targetCtx.ellipse(0, -5, 5, 13, 0, 0, Math.PI * 2);
                targetCtx.fill();

            } else if (shipData.type === 'viper') {
                targetCtx.fillStyle = '#ffaa00';
                targetCtx.beginPath();
                targetCtx.moveTo(-10, 18);
                targetCtx.lineTo(-6, 30 + Math.random() * 6);
                targetCtx.lineTo(-2, 18);
                targetCtx.moveTo(2, 18);
                targetCtx.lineTo(6, 30 + Math.random() * 6);
                targetCtx.lineTo(10, 18);
                targetCtx.fill();

                targetCtx.fillStyle = shipData.color;
                targetCtx.beginPath();
                targetCtx.moveTo(0, -30);
                targetCtx.lineTo(7, -15);
                targetCtx.lineTo(12, -8);
                targetCtx.lineTo(28, 12);
                targetCtx.lineTo(16, 22);
                targetCtx.lineTo(6, 18);
                targetCtx.lineTo(0, 24);
                targetCtx.lineTo(-6, 18);
                targetCtx.lineTo(-16, 22);
                targetCtx.lineTo(-28, 12);
                targetCtx.lineTo(-12, -8);
                targetCtx.lineTo(-7, -15);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.strokeStyle = shipData.wingColor;
                targetCtx.lineWidth = 2;
                targetCtx.beginPath();
                targetCtx.moveTo(0, -25);
                targetCtx.lineTo(24, 10);
                targetCtx.moveTo(0, -25);
                targetCtx.lineTo(-24, 10);
                targetCtx.stroke();

                targetCtx.fillStyle = shipData.accentColor;
                targetCtx.beginPath();
                targetCtx.ellipse(0, -4, 6, 12, 0, 0, Math.PI * 2);
                targetCtx.fill();

            } else if (shipData.type === 'aegis') {
                targetCtx.fillStyle = '#00ffaa';
                targetCtx.fillRect(-14, 18, 5, 10 + Math.random() * 4);
                targetCtx.fillRect(-2, 20, 4, 14 + Math.random() * 5);
                targetCtx.fillRect(9, 18, 5, 10 + Math.random() * 4);

                targetCtx.fillStyle = shipData.color;
                targetCtx.beginPath();
                targetCtx.moveTo(0, -28);
                targetCtx.lineTo(10, -18);
                targetCtx.lineTo(18, -10);
                targetCtx.lineTo(28, 4);
                targetCtx.lineTo(25, 20);
                targetCtx.lineTo(14, 15);
                targetCtx.lineTo(0, 22);
                targetCtx.lineTo(-14, 15);
                targetCtx.lineTo(-25, 20);
                targetCtx.lineTo(-28, 4);
                targetCtx.lineTo(-18, -10);
                targetCtx.lineTo(-10, -18);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = shipData.wingColor;
                targetCtx.beginPath();
                targetCtx.moveTo(-28, 4);
                targetCtx.lineTo(-20, -12);
                targetCtx.lineTo(-12, 0);
                targetCtx.lineTo(-20, 16);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.beginPath();
                targetCtx.moveTo(28, 4);
                targetCtx.lineTo(20, -12);
                targetCtx.lineTo(12, 0);
                targetCtx.lineTo(20, 16);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = shipData.accentColor;
                targetCtx.beginPath();
                targetCtx.arc(0, -2, 7, 0, Math.PI * 2);
                targetCtx.fill();
            }

            targetCtx.restore();
        }

        function renderEnemyShip(targetCtx, enemy) {
            targetCtx.save();
            targetCtx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
            const scale = enemy.width / 36;
            targetCtx.scale(scale, scale);

            targetCtx.shadowBlur = 14;
            targetCtx.shadowColor = enemy.color;

            targetCtx.fillStyle = '#ff3300';
            targetCtx.beginPath();
            targetCtx.moveTo(-6, -14);
            targetCtx.lineTo(0, -22 - Math.random() * 4);
            targetCtx.lineTo(6, -14);
            targetCtx.fill();

            targetCtx.fillStyle = enemy.color;
            targetCtx.beginPath();
            targetCtx.moveTo(0, 20);
            targetCtx.lineTo(8, 6);
            targetCtx.lineTo(22, -4);
            targetCtx.lineTo(16, -16);
            targetCtx.lineTo(7, -10);
            targetCtx.lineTo(0, -16);
            targetCtx.lineTo(-7, -10);
            targetCtx.lineTo(-16, -16);
            targetCtx.lineTo(-22, -4);
            targetCtx.lineTo(-8, 6);
            targetCtx.closePath();
            targetCtx.fill();

            targetCtx.fillStyle = '#00ffea';
            targetCtx.beginPath();
            targetCtx.ellipse(0, 2, 4, 8, 0, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.restore();
        }

        function renderBossShip(targetCtx, b) {
            targetCtx.save();
            targetCtx.translate(b.x + b.width / 2, b.y + b.height / 2);

            targetCtx.shadowBlur = 25;
            targetCtx.shadowColor = b.color;

            if (b.bossType === 0) {
                targetCtx.fillStyle = '#ffaa00';
                targetCtx.beginPath();
                targetCtx.moveTo(-20, -35);
                targetCtx.lineTo(0, -48 - Math.random() * 4);
                targetCtx.lineTo(20, -35);
                targetCtx.fill();

                targetCtx.fillStyle = '#1a0022';
                targetCtx.strokeStyle = b.color;
                targetCtx.lineWidth = 3;
                targetCtx.beginPath();
                targetCtx.moveTo(0, 42);
                targetCtx.lineTo(35, 20);
                targetCtx.lineTo(55, -15);
                targetCtx.lineTo(35, -35);
                targetCtx.lineTo(-35, -35);
                targetCtx.lineTo(-55, -15);
                targetCtx.lineTo(-35, 20);
                targetCtx.closePath();
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.fillStyle = b.color;
                targetCtx.beginPath();
                targetCtx.arc(0, 0, 16, 0, Math.PI * 2);
                targetCtx.fill();

            } else if (b.bossType === 1) {
                targetCtx.fillStyle = '#00f0ff';
                targetCtx.beginPath();
                targetCtx.moveTo(-35, -30);
                targetCtx.lineTo(0, -45);
                targetCtx.lineTo(35, -30);
                targetCtx.fill();

                targetCtx.fillStyle = '#051923';
                targetCtx.strokeStyle = b.color;
                targetCtx.lineWidth = 3;
                targetCtx.beginPath();
                targetCtx.moveTo(-50, -20);
                targetCtx.lineTo(-20, 35);
                targetCtx.lineTo(0, 45);
                targetCtx.lineTo(20, 35);
                targetCtx.lineTo(50, -20);
                targetCtx.lineTo(60, 10);
                targetCtx.lineTo(25, 25);
                targetCtx.lineTo(0, 10);
                targetCtx.lineTo(-25, 25);
                targetCtx.lineTo(-60, 10);
                targetCtx.closePath();
                targetCtx.fill();
                targetCtx.stroke();

                targetCtx.fillStyle = '#ffea00';
                targetCtx.fillRect(-12, -10, 24, 12);

            } else {
                targetCtx.fillStyle = '#e600ff';
                targetCtx.beginPath();
                targetCtx.arc(0, 0, 40, 0, Math.PI * 2);
                targetCtx.fillStyle = '#11001c';
                targetCtx.fill();
                targetCtx.strokeStyle = b.color;
                targetCtx.lineWidth = 4;
                targetCtx.stroke();

                targetCtx.fillStyle = '#00ffaa';
                targetCtx.fillRect(-50, -8, 100, 16);
                targetCtx.fillRect(-8, -50, 16, 100);

                targetCtx.fillStyle = '#ffffff';
                targetCtx.beginPath();
                targetCtx.arc(0, 0, 12, 0, Math.PI * 2);
                targetCtx.fill();
            }

            targetCtx.restore();
        }

        function drawHealthBar(targetCtx, x, y, width, height, currentHp, maxHp, label) {
            targetCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            targetCtx.fillRect(x, y, width, height);

            const hpRatio = Math.max(0, currentHp / maxHp);
            targetCtx.fillStyle = hpRatio > 0.5 ? '#00ff66' : hpRatio > 0.25 ? '#ffaa00' : '#ff0055';
            targetCtx.fillRect(x, y, width * hpRatio, height);

            targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            targetCtx.lineWidth = 1;
            targetCtx.strokeRect(x, y, width, height);

            if (label) {
                targetCtx.fillStyle = '#ffffff';
                targetCtx.font = 'bold 10px sans-serif';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(`${label}: ${Math.ceil(currentHp)}/${maxHp}`, x + width / 2, y - 3);
            }
        }

        function renderShipSelection() {
            shipListContainer.innerHTML = '';
            ships.forEach((ship, index) => {
                const card = document.createElement('div');
                card.className = `ship-card ${index === selectedShipIndex ? 'selected' : ''}`;
                card.onclick = () => {
                    selectedShipIndex = index;
                    renderShipSelection();
                };

                const previewId = `ship-preview-${index}`;

                card.innerHTML = `
                    <div class="ship-name" style="color:${ship.color}">${ship.name}</div>
                    <canvas id="${previewId}" class="ship-preview-canvas" width="48" height="48"></canvas>
                    <div class="stat-group">
                        <div class="stat-row"><span>Speed:</span> <span>${'★'.repeat(Math.ceil(ship.speed/3))}</span></div>
                        <div class="stat-row"><span>Base DMG:</span> <span>${ship.damage}</span></div>
                        <div class="stat-row"><span>HP Max:</span> <span>${ship.lives}</span></div>
                    </div>
                `;
                shipListContainer.appendChild(card);

                setTimeout(() => {
                    const pCanvas = document.getElementById(previewId);
                    if (pCanvas) {
                        const pCtx = pCanvas.getContext('2d');
                        pCtx.clearRect(0, 0, 48, 48);
                        renderDetailedShip(pCtx, 24, 24, 42, 42, ship);
                    }
                }, 10);
            });
        }

        renderShipSelection();

        let score = 0;
        let level = 1;
        let lives = 3;
        let gameLoop = null;
        let isGameRunning = false;
        let frameCount = 0;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 46,
            height: 46
        };

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let powerUps = [];

        for (let i = 0; i < 65; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        function spawnEnemy() {
            if (bossLevelActive) return;
            
            const size = Math.random() * 8 + 36;
            const maxHp = Math.floor(150 + (level - 1) * 80);
            
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                hp: maxHp,
                maxHp: maxHp,
                speed: Math.random() * 0.3 + 0.4,
                color: ['#ff0055', '#ffaa00', '#aa00ff', '#ff00aa'][Math.floor(Math.random() * 4)]
            });
        }

        function checkBossSpawn() {
            if (level % 10 === 0 && !activeBoss && !bossLevelActive) {
                bossLevelActive = true;
                enemies = [];
                const bossHp = 15000 + (level - 10) * 3000;
                const bossTypeIndex = Math.floor((level / 10) - 1) % 3;
                const bossColors = ['#ff0055', '#00f0ff', '#e600ff'];

                activeBoss = {
                    x: canvas.width / 2 - 50,
                    y: 65,
                    width: 100,
                    height: 80,
                    hp: bossHp,
                    maxHp: bossHp,
                    bossType: bossTypeIndex,
                    color: bossColors[bossTypeIndex]
                };
            }
        }

        function tryDropPowerUp(x, y, guaranteed = false, customChance = 0.5) {
            if (guaranteed || Math.random() < customChance) {
                const types = [
                    { type: 'damage', label: '+1x DMG', color: '#ff00ff' },
                    { type: 'fireRate', label: 'SPD', color: '#ffea00' },
                    { type: 'heal', label: 'HP', color: '#00ff66' }
                ];
                const selectedType = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                    x: x,
                    y: y,
                    width: 26,
                    height: 26,
                    speed: 1.8,
                    ...selectedType
                });
            }
        }

        function createParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function updatePlayerPosition() {
            const activeShip = ships[selectedShipIndex];
            const diff = targetX - player.x;
            
            if (Math.abs(diff) > 0.5) {
                const moveStep = Math.sign(diff) * Math.min(Math.abs(diff), activeShip.speed);
                player.x += moveStep;
            }
        }

        function drawPlayer() {
            const currentShip = ships[selectedShipIndex];
            renderDetailedShip(ctx, player.x, player.y, player.width, player.height, currentShip);
        }

        function shoot() {
            const currentShip = ships[selectedShipIndex];
            const currentDamage = currentShip.damage * playerBuffs.damageMultiplier;
            const bulletWidth = Math.min(18, 5 + Math.log2(playerBuffs.damageMultiplier || 1) * 3);

            if (currentShip.type === 'hyperion') {
                bullets.push({
                    x: player.x,
                    y: player.y - player.height / 2,
                    width: bulletWidth,
                    height: 18,
                    damage: currentDamage,
                    speed: 12
                });
            } else if (currentShip.type === 'viper') {
                bullets.push({ x: player.x - 14, y: player.y, width: bulletWidth, height: 16, damage: currentDamage, speed: 12 });
                bullets.push({ x: player.x + 14, y: player.y, width: bulletWidth, height: 16, damage: currentDamage, speed: 12 });
            } else {
                bullets.push({ x: player.x - 18, y: player.y, width: bulletWidth, height: 18, damage: currentDamage, speed: 11 });
                bullets.push({ x: player.x, y: player.y - 8, width: bulletWidth + 2, height: 20, damage: currentDamage, speed: 13 });
                bullets.push({ x: player.x + 18, y: player.y, width: bulletWidth, height: 18, damage: currentDamage, speed: 11 });
            }
            
            playSound(600 + Math.min(800, currentDamage * 2), 'sine', 0.05);
        }

        function bossAttack() {
            if (!activeBoss) return;

            if (frameCount % 100 === 0) {
                const bCenter = activeBoss.x + activeBoss.width / 2;
                const bY = activeBoss.y + activeBoss.height / 2;
                
                for (let i = 0; i < 5; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const bulletSpeed = 1.8;
                    enemyBullets.push({
                        x: bCenter,
                        y: bY,
                        width: 7,
                        height: 7,
                        vx: Math.cos(angle) * bulletSpeed,
                        vy: Math.sin(angle) * bulletSpeed,
                        isBossBullet: true
                    });
                }
                playSound(220, 'square', 0.1);
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;
                
                ctx.shadowBlur = playerBuffs.damageMultiplier > 1 ? 15 : 8;
                ctx.shadowColor = playerBuffs.damageMultiplier > 1 ? '#ff00ff' : '#00f0ff';
                ctx.fillStyle = playerBuffs.damageMultiplier > 1 ? '#ffccff' : ships[selectedShipIndex].color;
                ctx.fillRect(b.x - b.width / 2, b.y, b.width, b.height);
                ctx.shadowBlur = 0;

                if (b.y < 0) bullets.splice(i, 1);
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                
                if (eb.isBossBullet) {
                    eb.x += eb.vx;
                    eb.y += eb.vy;
                } else {
                    eb.y += eb.speed;
                }

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                
                if (eb.isBossBullet) {
                    ctx.beginPath();
                    ctx.arc(eb.x, eb.y, eb.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(eb.x - eb.width / 2, eb.y, eb.width, eb.height);
                }
                ctx.shadowBlur = 0;

                let dist = Math.hypot(player.x - eb.x, player.y - eb.y);
                if (dist < player.width / 2) {
                    createParticles(player.x, player.y, '#ff0055', 15);
                    playSound(150, 'sawtooth', 0.2);
                    enemyBullets.splice(i, 1);
                    lives--;
                    livesElement.textContent = lives;
                    if (lives <= 0) handleGameOver();
                    continue;
                }

                if (eb.y > canvas.height || eb.y < -20 || eb.x < -20 || eb.x > canvas.width + 20) {
                    enemyBullets.splice(i, 1);
                }
            }
        }

        function updatePowerUps() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let p = powerUps[i];
                p.y += p.speed;

                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.width / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.label, p.x, p.y);
                ctx.restore();

                let dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < player.width / 2 + p.width / 2) {
                    if (p.type === 'damage') {
                        playerBuffs.damageMultiplier += 1;
                        dmgMultElement.textContent = `${playerBuffs.damageMultiplier}x`;
                    } else if (p.type === 'fireRate') {
                        playerBuffs.fireRateBoost += 2;
                    } else if (p.type === 'heal') {
                        lives++;
                        livesElement.textContent = lives;
                    }

                    createParticles(p.x, p.y, p.color, 20);
                    playSound(1200, 'triangle', 0.2);
                    powerUps.splice(i, 1);
                    continue;
                }

                if (p.y > canvas.height + 20) powerUps.splice(i, 1);
            }
        }

        function updateBoss() {
            if (!activeBoss) return;

            renderBossShip(ctx, activeBoss);
            drawHealthBar(ctx, 40, 20, canvas.width - 80, 12, activeBoss.hp, activeBoss.maxHp, `BOSS LEVEL ${level}`);

            bossAttack();

            if (frameCount % 50 === 0) {
                tryDropPowerUp(
                    activeBoss.x + Math.random() * activeBoss.width,
                    activeBoss.y + activeBoss.height / 2,
                    false,
                    0.75
                );
            }

            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (
                    b.x > activeBoss.x &&
                    b.x < activeBoss.x + activeBoss.width &&
                    b.y > activeBoss.y &&
                    b.y < activeBoss.y + activeBoss.height
                ) {
                    activeBoss.hp -= b.damage;
                    createParticles(b.x, b.y, '#ff00ff', 8);
                    bullets.splice(j, 1);
                    playSound(350, 'square', 0.05);

                    if (activeBoss.hp <= 0) {
                        createParticles(activeBoss.x + activeBoss.width / 2, activeBoss.y + activeBoss.height / 2, '#ff00ff', 40);
                        playSound(100, 'sawtooth', 0.5);

                        for (let k = 0; k < 4; k++) {
                            tryDropPowerUp(activeBoss.x + activeBoss.width / 2 + (k - 1.5) * 25, activeBoss.y + activeBoss.height / 2, true);
                        }

                        score += 500;
                        scoreElement.textContent = score;

                        activeBoss = null;
                        bossLevelActive = false;
                        
                        level += 1;
                        levelElement.textContent = level;
                        playSound(900, 'sine', 0.3);
                        break;
                    }
                }
            }
        }

        function updateEnemies() {
            if (bossLevelActive) return;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                renderEnemyShip(ctx, e);
                drawHealthBar(ctx, e.x + (e.width - 34) / 2, e.y - 10, 34, 5, e.hp, e.maxHp, `${Math.ceil(e.hp)}`);

                if (Math.random() < 0.002) {
                    enemyBullets.push({
                        x: e.x + e.width / 2,
                        y: e.y + e.height,
                        width: 4,
                        height: 12,
                        speed: 2.0
                    });
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (
                        b.x > e.x &&
                        b.x < e.x + e.width &&
                        b.y > e.y &&
                        b.y < e.y + e.height
                    ) {
                        e.hp -= b.damage;
                        createParticles(b.x, b.y, e.color, 6);
                        bullets.splice(j, 1);
                        playSound(350, 'square', 0.05);

                        if (e.hp <= 0) {
                            createParticles(e.x + e.width / 2, e.y + e.height / 2, e.color, 16);
                            playSound(200, 'sawtooth', 0.08);

                            tryDropPowerUp(e.x + e.width / 2, e.y + e.height / 2, false, 0.4);

                            enemies.splice(i, 1);
                            score += 25;
                            scoreElement.textContent = score;

                            if (level % 10 !== 0) {
                                const targetLevel = Math.floor(score / 50) + 1;
                                if (targetLevel > level && targetLevel % 10 !== 0) {
                                    level = targetLevel;
                                    levelElement.textContent = level;
                                    playSound(900, 'sine', 0.2);
                                } else if (targetLevel >= level && (level + 1) % 10 === 0 && score >= level * 50) {
                                    level += 1;
                                    levelElement.textContent = level;
                                    playSound(900, 'sine', 0.2);
                                }
                            }
                            break;
                        }
                    }
                }

                if (e) {
                    let dist = Math.hypot(player.x - (e.x + e.width / 2), player.y - (e.y + e.height / 2));
                    if (dist < player.width / 2 + e.width / 2) {
                        createParticles(e.x + e.width / 2, e.y + e.height / 2, '#ff0055', 20);
                        playSound(150, 'sawtooth', 0.2);
                        enemies.splice(i, 1);
                        lives--;
                        livesElement.textContent = lives;

                        if (lives <= 0) handleGameOver();
                    } else if (e.y > canvas.height) {
                        enemies.splice(i, 1);
                    }
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function resetGame() {
            const activeShip = ships[selectedShipIndex];
            score = 0;
            level = 1;
            lives = activeShip.lives;
            playerBuffs = { damageMultiplier: 1, fireRateBoost: 0 };
            dmgMultElement.textContent = '1x';
            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            powerUps = [];
            activeBoss = null;
            bossLevelActive = false;
            scoreElement.textContent = score;
            levelElement.textContent = level;
            livesElement.textContent = lives;
            player.x = canvas.width / 2;
            targetX = canvas.width / 2;
            player.y = canvas.height - 50;
        }

        function handleGameOver() {
            isGameRunning = false;
            cancelAnimationFrame(gameLoop);

            finalScoreText.textContent = `Skor Kamu: ${score} | Multiplier DMG Terakhir: ${playerBuffs.damageMultiplier}x`;
            gameOverOverlay.classList.remove('hidden');
        }

        function draw() {
            if (!isGameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const activeShip = ships[selectedShipIndex];
            frameCount++;
            
            const effectiveFireRate = Math.max(6, activeShip.fireRate - playerBuffs.fireRateBoost);
            const spawnInterval = 65;
            
            checkBossSpawn();

            if (frameCount % spawnInterval === 0) spawnEnemy();
            if (frameCount % effectiveFireRate === 0) shoot();

            drawStars();
            updatePlayerPosition();
            drawPlayer();
            updateBullets();
            updatePowerUps();
            updateEnemies();
            updateBoss();
            updateParticles();

            gameLoop = requestAnimationFrame(draw);
        }

        function setPlayerTarget(clientX) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            targetX = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, mouseX));
        }

        window.addEventListener('mousemove', e => {
            if (isGameRunning) setPlayerTarget(e.clientX);
        });

        window.addEventListener('touchmove', e => {
            if (isGameRunning && e.touches.length > 0) {
                setPlayerTarget(e.touches[0].clientX);
            }
        });

        startBtn.addEventListener('click', () => {
            initAudio();
            startOverlay.classList.add('hidden');
            resetGame();
            isGameRunning = true;
            draw();
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            gameOverOverlay.classList.add('hidden');
            resetGame();
            isGameRunning = true;
            draw();
        });
    </script>
</body>
</html>
