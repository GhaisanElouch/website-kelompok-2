<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender Neon - Boss & Enhanced Visuals</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030408;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 10px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .info-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-title {
            font-size: 0.65rem;
            color: #7b809a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(0, 240, 255, 0.4);
        }

        canvas {
            display: block;
            background-color: #020205;
            cursor: crosshair;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 5, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            transition: opacity 0.3s ease;
            padding: 20px;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.9);
        }

        .author-tag {
            font-size: 1rem;
            font-weight: bold;
            color: #ff007f;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #9398ac;
            margin-bottom: 15px;
        }

        .ship-selection-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #00ff66;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .ship-list {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
        }

        .ship-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 8px;
            width: 130px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ship-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
        }

        .ship-card.selected {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            background: rgba(0, 240, 255, 0.1);
        }

        .ship-name {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .ship-preview-canvas {
            width: 44px;
            height: 44px;
            margin-bottom: 6px;
        }

        .stat-group {
            width: 100%;
            font-size: 0.65rem;
            color: #aaa;
            text-align: left;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .btn {
            padding: 12px 34px;
            font-size: 1rem;
            font-weight: bold;
            color: #020205;
            background: #00f0ff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 240, 255, 1);
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="info-box">
                <span class="info-title">Skor</span>
                <span id="score" class="info-value">0</span>
            </div>
            <div class="info-box">
                <span class="info-title">Level</span>
                <span id="level" class="info-value" style="color: #00ff66; text-shadow: 0 0 10px rgba(0,255,102,0.6);">1</span>
            </div>
            <div class="info-box">
                <span class="info-title">Nyawa</span>
                <span id="lives" class="info-value" style="color: #ff0055; text-shadow: 0 0 10px rgba(255,0,85,0.6);">3</span>
            </div>
            <div class="info-box">
                <span class="info-title">Tertinggi</span>
                <span id="high-score" class="info-value" style="color: #ffaa00; text-shadow: 0 0 10px rgba(255,170,0,0.6);">0</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="450" height="550"></canvas>

            <div id="startOverlay" class="overlay">
                <h1 class="title">SPACE DEFENDER</h1>
                <div class="author-tag">By Arya</div>
                <p class="subtitle">Setiap Level 10 Lawan Boss | 27% Chance Buff Drop!</p>
                
                <div class="ship-selection-title">--- Pilih Pesawat ---</div>
                <div class="ship-list" id="shipList"></div>

                <button id="startBtn" class="btn">Mulai Main</button>
            </div>

            <div id="gameOverOverlay" class="overlay hidden">
                <h1 class="title" style="color: #ff0055; text-shadow: 0 0 20px rgba(255,0,85,0.9);">GAME OVER</h1>
                <div class="author-tag">By Arya</div>
                <p id="finalScoreText" class="subtitle">Skor Kamu: 0 | Level: 1</p>
                <button id="restartBtn" class="btn">Coba Lagi</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const livesElement = document.getElementById('lives');
        const highScoreElement = document.getElementById('high-score');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const shipListContainer = document.getElementById('shipList');

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const ships = [
            {
                name: 'Falcon Interceptor',
                color: '#00f0ff',
                accentColor: '#ffffff',
                speed: 8,
                damage: 1,
                fireRate: 9,
                lives: 3,
                type: 'falcon'
            },
            {
                name: 'Viper Phantom Jet',
                color: '#ffaa00',
                accentColor: '#ff0055',
                speed: 10,
                damage: 2,
                fireRate: 7,
                lives: 4,
                type: 'viper'
            },
            {
                name: 'Titan Dreadnought',
                color: '#e600ff',
                accentColor: '#00ffaa',
                speed: 12,
                damage: 3,
                fireRate: 5,
                lives: 5,
                type: 'titan'
            }
        ];

        let selectedShipIndex = 0;
        let playerBuffs = { bonusDamage: 0, fireRateBoost: 0 };
        let activeBoss = null;
        let bossLevelActive = false;

        function renderDetailedShip(targetCtx, x, y, width, height, shipData) {
            targetCtx.save();
            targetCtx.translate(x, y);
            const scale = width / 44;
            targetCtx.scale(scale, scale);

            targetCtx.shadowBlur = 15;
            targetCtx.shadowColor = shipData.color;

            if (shipData.type === 'falcon') {
                targetCtx.fillStyle = '#00f0ff';
                targetCtx.beginPath();
                targetCtx.moveTo(-4, 18);
                targetCtx.lineTo(0, 28 + Math.random() * 6);
                targetCtx.lineTo(4, 18);
                targetCtx.fill();

                targetCtx.fillStyle = shipData.color;
                targetCtx.beginPath();
                targetCtx.moveTo(0, -24);
                targetCtx.lineTo(7, -8);
                targetCtx.lineTo(24, 8);
                targetCtx.lineTo(20, 18);
                targetCtx.lineTo(8, 12);
                targetCtx.lineTo(4, 20);
                targetCtx.lineTo(-4, 20);
                targetCtx.lineTo(-8, 12);
                targetCtx.lineTo(-20, 18);
                targetCtx.lineTo(-24, 8);
                targetCtx.lineTo(-7, -8);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = shipData.accentColor;
                targetCtx.fillRect(-22, 0, 4, 14);
                targetCtx.fillRect(18, 0, 4, 14);

                targetCtx.fillStyle = '#ffffff';
                targetCtx.beginPath();
                targetCtx.ellipse(0, -6, 4, 12, 0, 0, Math.PI * 2);
                targetCtx.fill();

            } else if (shipData.type === 'viper') {
                targetCtx.fillStyle = '#ffaa00';
                targetCtx.beginPath();
                targetCtx.moveTo(-8, 16);
                targetCtx.lineTo(-4, 26 + Math.random() * 5);
                targetCtx.lineTo(-1, 16);
                targetCtx.moveTo(1, 16);
                targetCtx.lineTo(4, 26 + Math.random() * 5);
                targetCtx.lineTo(8, 16);
                targetCtx.fill();

                targetCtx.fillStyle = shipData.color;
                targetCtx.beginPath();
                targetCtx.moveTo(-5, -24);
                targetCtx.lineTo(0, -18);
                targetCtx.lineTo(5, -24);
                targetCtx.lineTo(10, -6);
                targetCtx.lineTo(24, 10);
                targetCtx.lineTo(16, 20);
                targetCtx.lineTo(6, 16);
                targetCtx.lineTo(0, 22);
                targetCtx.lineTo(-6, 16);
                targetCtx.lineTo(-16, 20);
                targetCtx.lineTo(-24, 10);
                targetCtx.lineTo(-10, -6);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = shipData.accentColor;
                targetCtx.beginPath();
                targetCtx.ellipse(0, -3, 5, 11, 0, 0, Math.PI * 2);
                targetCtx.fill();

            } else if (shipData.type === 'titan') {
                targetCtx.fillStyle = '#00ffaa';
                targetCtx.fillRect(-12, 16, 5, 8 + Math.random() * 4);
                targetCtx.fillRect(-2, 18, 4, 11 + Math.random() * 5);
                targetCtx.fillRect(7, 16, 5, 8 + Math.random() * 4);

                targetCtx.fillStyle = shipData.color;
                targetCtx.beginPath();
                targetCtx.moveTo(0, -24);
                targetCtx.lineTo(8, -14);
                targetCtx.lineTo(16, -6);
                targetCtx.lineTo(26, 6);
                targetCtx.lineTo(22, 18);
                targetCtx.lineTo(12, 12);
                targetCtx.lineTo(0, 18);
                targetCtx.lineTo(-12, 12);
                targetCtx.lineTo(-22, 18);
                targetCtx.lineTo(-26, 6);
                targetCtx.lineTo(-16, -6);
                targetCtx.lineTo(-8, -14);
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.fillStyle = shipData.accentColor;
                targetCtx.fillRect(-24, -4, 5, 16);
                targetCtx.fillRect(19, -4, 5, 16);

                targetCtx.beginPath();
                targetCtx.arc(0, -2, 6, 0, Math.PI * 2);
                targetCtx.fill();
            }

            targetCtx.restore();
        }

        function renderEnemyShip(targetCtx, enemy) {
            targetCtx.save();
            targetCtx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
            const scale = enemy.width / 36;
            targetCtx.scale(scale, scale);

            targetCtx.shadowBlur = 14;
            targetCtx.shadowColor = enemy.color;

            targetCtx.fillStyle = '#ff3300';
            targetCtx.beginPath();
            targetCtx.moveTo(-6, -14);
            targetCtx.lineTo(0, -22 - Math.random() * 4);
            targetCtx.lineTo(6, -14);
            targetCtx.fill();

            targetCtx.fillStyle = enemy.color;
            targetCtx.beginPath();
            targetCtx.moveTo(0, 20);
            targetCtx.lineTo(8, 6);
            targetCtx.lineTo(22, -4);
            targetCtx.lineTo(16, -16);
            targetCtx.lineTo(7, -10);
            targetCtx.lineTo(0, -16);
            targetCtx.lineTo(-7, -10);
            targetCtx.lineTo(-16, -16);
            targetCtx.lineTo(-22, -4);
            targetCtx.lineTo(-8, 6);
            targetCtx.closePath();
            targetCtx.fill();

            targetCtx.fillStyle = '#00ffea';
            targetCtx.beginPath();
            targetCtx.ellipse(0, 2, 4, 8, 0, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(-15, -4, 3, 10);
            targetCtx.fillRect(12, -4, 3, 10);

            targetCtx.restore();
        }

        function renderBossShip(targetCtx, b) {
            targetCtx.save();
            targetCtx.translate(b.x + b.width / 2, b.y + b.height / 2);

            targetCtx.shadowBlur = 25;
            targetCtx.shadowColor = '#ff0055';

            targetCtx.fillStyle = '#ffaa00';
            targetCtx.beginPath();
            targetCtx.moveTo(-20, -35);
            targetCtx.lineTo(-10, -48 - Math.random() * 5);
            targetCtx.lineTo(0, -35);
            targetCtx.lineTo(10, -48 - Math.random() * 5);
            targetCtx.lineTo(20, -35);
            targetCtx.fill();

            targetCtx.fillStyle = '#220033';
            targetCtx.strokeStyle = '#ff0055';
            targetCtx.lineWidth = 3;

            targetCtx.beginPath();
            targetCtx.moveTo(0, 40);
            targetCtx.lineTo(30, 25);
            targetCtx.lineTo(55, -10);
            targetCtx.lineTo(40, -35);
            targetCtx.lineTo(15, -25);
            targetCtx.lineTo(0, -35);
            targetCtx.lineTo(-15, -25);
            targetCtx.lineTo(-40, -35);
            targetCtx.lineTo(-55, -10);
            targetCtx.lineTo(-30, 25);
            targetCtx.closePath();
            targetCtx.fill();
            targetCtx.stroke();

            targetCtx.fillStyle = '#ff0055';
            targetCtx.beginPath();
            targetCtx.arc(0, 0, 16, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = '#ffffff';
            targetCtx.beginPath();
            targetCtx.arc(0, 0, 8, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = '#00f0ff';
            targetCtx.fillRect(-45, -5, 6, 25);
            targetCtx.fillRect(39, -5, 6, 25);

            targetCtx.restore();
        }

        function drawHealthBar(targetCtx, x, y, width, height, currentHp, maxHp, label) {
            targetCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            targetCtx.fillRect(x, y, width, height);

            const hpRatio = Math.max(0, currentHp / maxHp);
            targetCtx.fillStyle = hpRatio > 0.5 ? '#00ff66' : hpRatio > 0.25 ? '#ffaa00' : '#ff0055';
            targetCtx.fillRect(x, y, width * hpRatio, height);

            targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            targetCtx.lineWidth = 1;
            targetCtx.strokeRect(x, y, width, height);

            if (label) {
                targetCtx.fillStyle = '#ffffff';
                targetCtx.font = 'bold 10px sans-serif';
                targetCtx.textAlign = 'center';
                targetCtx.fillText(`${label}: ${currentHp}/${maxHp}`, x + width / 2, y - 3);
            }
        }

        function renderShipSelection() {
            shipListContainer.innerHTML = '';
            ships.forEach((ship, index) => {
                const card = document.createElement('div');
                card.className = `ship-card ${index === selectedShipIndex ? 'selected' : ''}`;
                card.onclick = () => {
                    selectedShipIndex = index;
                    renderShipSelection();
                };

                const previewId = `ship-preview-${index}`;

                card.innerHTML = `
                    <div class="ship-name" style="color:${ship.color}">${ship.name}</div>
                    <canvas id="${previewId}" class="ship-preview-canvas" width="44" height="44"></canvas>
                    <div class="stat-group">
                        <div class="stat-row"><span>Speed:</span> <span>${'★'.repeat(Math.ceil(ship.speed/4))}</span></div>
                        <div class="stat-row"><span>Damage:</span> <span>${'★'.repeat(ship.damage)}</span></div>
                        <div class="stat-row"><span>HP Max:</span> <span>${ship.lives}</span></div>
                    </div>
                `;
                shipListContainer.appendChild(card);

                setTimeout(() => {
                    const pCanvas = document.getElementById(previewId);
                    if (pCanvas) {
                        const pCtx = pCanvas.getContext('2d');
                        pCtx.clearRect(0, 0, 44, 44);
                        renderDetailedShip(pCtx, 22, 22, 36, 36, ship);
                    }
                }, 10);
            });
        }

        renderShipSelection();

        let score = 0;
        let level = 1;
        let lives = 3;
        let highScore = localStorage.getItem('space_high_score') || 0;
        let gameLoop = null;
        let isGameRunning = false;
        let frameCount = 0;

        highScoreElement.textContent = highScore;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 44,
            height: 44
        };

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let powerUps = [];

        for (let i = 0; i < 65; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        function spawnEnemy() {
            if (bossLevelActive) return;
            
            const size = Math.random() * 8 + 32;
            const maxHp = Math.floor(3 + (level - 1) * 3);
            
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                hp: maxHp,
                maxHp: maxHp,
                speed: Math.random() * 0.6 + 1.2,
                color: ['#ff0055', '#ffaa00', '#aa00ff', '#ff00aa'][Math.floor(Math.random() * 4)]
            });
        }

        function checkBossSpawn() {
            if (level % 10 === 0 && !activeBoss && !bossLevelActive) {
                bossLevelActive = true;
                enemies = [];
                const bossHp = level * 100;
                activeBoss = {
                    x: canvas.width / 2 - 50,
                    y: 60,
                    width: 100,
                    height: 80,
                    hp: bossHp,
                    maxHp: bossHp,
                    lastAttack: 0
                };
            }
        }

        function tryDropPowerUp(x, y) {
            if (Math.random() < 0.27) {
                const types = [
                    { type: 'damage', label: 'DMG', color: '#ff0055' },
                    { type: 'fireRate', label: 'SPD', color: '#ffea00' },
                    { type: 'heal', label: 'HP', color: '#00ff66' }
                ];
                const selectedType = types[Math.floor(Math.random() * types.length)];
                powerUps.push({
                    x: x,
                    y: y,
                    width: 24,
                    height: 24,
                    speed: 1.8,
                    ...selectedType
                });
            }
        }

        function createParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function drawPlayer() {
            const currentShip = ships[selectedShipIndex];
            renderDetailedShip(ctx, player.x, player.y, player.width, player.height, currentShip);
        }

        function shoot() {
            const currentShip = ships[selectedShipIndex];
            const currentDamage = currentShip.damage + playerBuffs.bonusDamage;

            if (currentShip.type === 'falcon') {
                bullets.push({
                    x: player.x,
                    y: player.y - player.height / 2,
                    width: 5,
                    height: 16,
                    damage: currentDamage,
                    speed: 11
                });
            } else if (currentShip.type === 'viper') {
                bullets.push({ x: player.x - 12, y: player.y, width: 4, height: 14, damage: currentDamage, speed: 11 });
                bullets.push({ x: player.x + 12, y: player.y, width: 4, height: 14, damage: currentDamage, speed: 11 });
            } else {
                bullets.push({ x: player.x - 16, y: player.y, width: 5, height: 16, damage: currentDamage, speed: 10 });
                bullets.push({ x: player.x, y: player.y - 8, width: 6, height: 18, damage: currentDamage, speed: 12 });
                bullets.push({ x: player.x + 16, y: player.y, width: 5, height: 16, damage: currentDamage, speed: 10 });
            }
            
            playSound(600 + (currentDamage * 50), 'sine', 0.05);
        }

        function bossAttack() {
            if (!activeBoss) return;

            if (frameCount % 45 === 0) {
                const bCenter = activeBoss.x + activeBoss.width / 2;
                enemyBullets.push(
                    { x: bCenter - 35, y: activeBoss.y + 60, width: 6, height: 14, speed: 5, vx: -1 },
                    { x: bCenter, y: activeBoss.y + 70, width: 8, height: 18, speed: 6, vx: 0 },
                    { x: bCenter + 35, y: activeBoss.y + 60, width: 6, height: 14, speed: 5, vx: 1 }
                );
                playSound(220, 'square', 0.1);
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= b.speed;
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffffff';
                ctx.fillStyle = ships[selectedShipIndex].color;
                ctx.fillRect(b.x - b.width / 2, b.y, b.width, b.height);
                ctx.shadowBlur = 0;

                if (b.y < 0) bullets.splice(i, 1);
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.y += eb.speed;
                if (eb.vx) eb.x += eb.vx;

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(eb.x - eb.width / 2, eb.y, eb.width, eb.height);
                ctx.shadowBlur = 0;

                let dist = Math.hypot(player.x - eb.x, player.y - eb.y);
                if (dist < player.width / 2) {
                    createParticles(player.x, player.y, '#ff0055', 15);
                    playSound(150, 'sawtooth', 0.2);
                    enemyBullets.splice(i, 1);
                    lives--;
                    livesElement.textContent = lives;
                    if (lives <= 0) handleGameOver();
                    continue;
                }

                if (eb.y > canvas.height || eb.x < 0 || eb.x > canvas.width) enemyBullets.splice(i, 1);
            }
        }

        function updatePowerUps() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let p = powerUps[i];
                p.y += p.speed;

                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.width / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.label, p.x, p.y);
                ctx.restore();

                let dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < player.width / 2 + p.width / 2) {
                    if (p.type === 'damage') {
                        playerBuffs.bonusDamage += 1;
                    } else if (p.type === 'fireRate') {
                        playerBuffs.fireRateBoost += 1;
                    } else if (p.type === 'heal') {
                        lives++;
                        livesElement.textContent = lives;
                    }

                    createParticles(p.x, p.y, p.color, 15);
                    playSound(1000, 'triangle', 0.15);
                    powerUps.splice(i, 1);
                    continue;
                }

                if (p.y > canvas.height + 20) powerUps.splice(i, 1);
            }
        }

        function updateBoss() {
            if (!activeBoss) return;

            renderBossShip(ctx, activeBoss);
            drawHealthBar(ctx, 50, 20, canvas.width - 100, 10, activeBoss.hp, activeBoss.maxHp, `BOSS LEVEL ${level}`);

            bossAttack();

            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (
                    b.x > activeBoss.x &&
                    b.x < activeBoss.x + activeBoss.width &&
                    b.y > activeBoss.y &&
                    b.y < activeBoss.y + activeBoss.height
                ) {
                    activeBoss.hp -= b.damage;
                    createParticles(b.x, b.y, '#ff0055', 6);
                    bullets.splice(j, 1);
                    playSound(350, 'square', 0.05);

                    if (activeBoss.hp <= 0) {
                        createParticles(activeBoss.x + activeBoss.width / 2, activeBoss.y + activeBoss.height / 2, '#ff0055', 40);
                        playSound(100, 'sawtooth', 0.5);

                        for (let k = 0; k < 3; k++) {
                            tryDropPowerUp(activeBoss.x + activeBoss.width / 2 + (k - 1) * 25, activeBoss.y + activeBoss.height / 2);
                        }

                        score += 500 * level;
                        scoreElement.textContent = score;

                        activeBoss = null;
                        bossLevelActive = false;
                        level++;
                        levelElement.textContent = level;
                        playSound(900, 'sine', 0.3);
                        break;
                    }
                }
            }
        }

        function updateEnemies() {
            if (bossLevelActive) return;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                renderEnemyShip(ctx, e);
                drawHealthBar(ctx, e.x + (e.width - 32) / 2, e.y - 8, 32, 4, e.hp, e.maxHp, null);

                if (Math.random() < 0.008) {
                    enemyBullets.push({
                        x: e.x + e.width / 2,
                        y: e.y + e.height,
                        width: 4,
                        height: 12,
                        speed: 4.5
                    });
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (
                        b.x > e.x &&
                        b.x < e.x + e.width &&
                        b.y > e.y &&
                        b.y < e.y + e.height
                    ) {
                        e.hp -= b.damage;
                        createParticles(b.x, b.y, e.color, 5);
                        bullets.splice(j, 1);
                        playSound(350, 'square', 0.05);

                        if (e.hp <= 0) {
                            createParticles(e.x + e.width / 2, e.y + e.height / 2, e.color, 16);
                            playSound(200, 'sawtooth', 0.08);

                            tryDropPowerUp(e.x + e.width / 2, e.y + e.height / 2);

                            enemies.splice(i, 1);
                            score += 25 * level;
                            scoreElement.textContent = score;

                            const nextLevel = Math.floor(score / 150) + 1;
                            if (nextLevel > level) {
                                level = nextLevel;
                                levelElement.textContent = level;
                                playSound(900, 'sine', 0.2);
                            }
                            break;
                        }
                    }
                }

                if (e) {
                    let dist = Math.hypot(player.x - (e.x + e.width / 2), player.y - (e.y + e.height / 2));
                    if (dist < player.width / 2 + e.width / 2) {
                        createParticles(e.x + e.width / 2, e.y + e.height / 2, '#ff0055', 20);
                        playSound(150, 'sawtooth', 0.2);
                        enemies.splice(i, 1);
                        lives--;
                        livesElement.textContent = lives;

                        if (lives <= 0) handleGameOver();
                    } else if (e.y > canvas.height) {
                        enemies.splice(i, 1);
                    }
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function resetGame() {
            const activeShip = ships[selectedShipIndex];
            score = 0;
            level = 1;
            lives = activeShip.lives;
            playerBuffs = { bonusDamage: 0, fireRateBoost: 0 };
            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            powerUps = [];
            activeBoss = null;
            bossLevelActive = false;
            scoreElement.textContent = score;
            levelElement.textContent = level;
            livesElement.textContent = lives;
            player.x = canvas.width / 2;
            player.y = canvas.height - 50;
        }

        function handleGameOver() {
            isGameRunning = false;
            cancelAnimationFrame(gameLoop);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('space_high_score', highScore);
                highScoreElement.textContent = highScore;
            }

            finalScoreText.textContent = `Skor Kamu: ${score} | Level Terakhir: ${level}`;
            gameOverOverlay.classList.remove('hidden');
        }

        function draw() {
            if (!isGameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const activeShip = ships[selectedShipIndex];
            frameCount++;
            
            const effectiveFireRate = Math.max(2, activeShip.fireRate - playerBuffs.fireRateBoost);
            const spawnInterval = Math.max(20, 50);
            
            checkBossSpawn();

            if (frameCount % spawnInterval === 0) spawnEnemy();
            if (frameCount % effectiveFireRate === 0) shoot();

            drawStars();
            drawPlayer();
            updateBullets();
            updatePowerUps();
            updateEnemies();
            updateBoss();
            updateParticles();

            gameLoop = requestAnimationFrame(draw);
        }

        function movePlayer(clientX) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, mouseX));
        }

        window.addEventListener('mousemove', e => {
            if (isGameRunning) movePlayer(e.clientX);
        });

        window.addEventListener('touchmove', e => {
            if (isGameRunning && e.touches.length > 0) {
                movePlayer(e.touches[0].clientX);
            }
        });

        startBtn.addEventListener('click', () => {
            initAudio();
            startOverlay.classList.add('hidden');
            resetGame();
            isGameRunning = true;
            draw();
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            gameOverOverlay.classList.add('hidden');
            resetGame();
            isGameRunning = true;
            draw();
        });
    </script>
</body>
</html>
