<!DOCTYPE html>
<html lang="id">
<head>

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff3333;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 5;
        }
        #stamina-container {
            margin-top: 10px;
            width: 200px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #ff3333;
            border-radius: 4px;
            overflow: hidden;
        }
        #stamina-bar {
            width: 100%;
            height: 100%;
            background-color: #ffcc00;
            transition: width 0.1s linear;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #instructions, #game-over, #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #eee;
            text-align: center;
            background: rgba(10, 10, 10, 0.95);
            padding: 30px;
            border: 2px solid #880000;
            box-shadow: 0 0 20px #ff0000;
            z-index: 10;
        }
        #instructions { cursor: pointer; }
        #game-over, #win-screen { display: none; }
        #win-screen { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; }

        #jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 999;
            justify-content: center;
            align-items: center;
            animation: strobe 0.05s infinite;
        }

            width: 400px;
            height: 400px;

            justify-content: center;
            align-items: center;
            animation: zoomAndShake 0.15s infinite alternate, intenseZoom 0.8s ease-in forwards;
            box-shadow: 0 0 150px #ff0000;
        }
